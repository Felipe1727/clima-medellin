[project]
name = "clima-medellin"
version = "0.1.0"
description = "CLI académica: clima y PM2.5 de Medellín con Open-Meteo, ObjectDB y análisis en Python"
requires-python = ">=3.14"
dependencies = [
    "matplotlib",
    "pandas",
    "requests",
    "scikit-learn",
    "statsmodels",
]

[project.scripts]
clima-medellin = "clima_medellin.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clima_medellin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
