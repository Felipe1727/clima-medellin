name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Configurar uv
        uses: astral-sh/setup-uv@v6

      - name: Instalar
        run: cd java && mvn -q -B -DskipTests package && cd ../python && uv sync

      - name: Probar
        run: cd java && mvn -q -B verify && cd ../python && uv run pytest

      - name: Analizar estilo
        run: cd python && uv run ruff check .
